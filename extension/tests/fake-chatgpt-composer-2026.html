<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>NEW COMPOSER FIXTURE (not ChatGPT)</title>
<style>
body { font: 15px sans-serif; padding: 20px; }
[data-composer-markdown] { border: 1px solid #888; min-height: 45px; width: 600px; }
[data-message-author-role] { padding: 8px; width: 600px; }
button { margin-top: 10px; padding: 9px; }
.markdown { white-space: pre-wrap; }
</style></head><body>
<h1>FICTIONAL 2026 APP-SHELL, NOT ChatGPT</h1>
<div data-message-author-role="assistant"><div class="markdown">OLD ASSISTANT MESSAGE. NOT A REPLY.</div></div>
<section aria-label="Old turn edit">
  <div class="ProseMirror" role="textbox" contenteditable="true" data-edit-message="true"></div>
</section>
<form data-chatgpt-composer>
  <div data-composer-input>
    <div data-composer-markdown class="ProseMirror" role="textbox" aria-label="Ask ChatGPT" contenteditable="true"></div>
  </div>
  <button data-testid="send-button" type="button">Wyślij</button>
</form>
<script>
const input = document.querySelector('[data-composer-markdown]');
document.querySelector('[data-testid="send-button"]').addEventListener('click', () => {
  const prompt = input.innerText || input.textContent || '';
  if (!prompt.includes('[POCZĄTEK WIADOMOŚCI NINY]')) return;
  const user = document.createElement('div');
  user.setAttribute('data-message-author-role', 'user');
  const bubble = document.createElement('div');
  bubble.className = 'whitespace-pre-wrap';
  bubble.textContent = prompt;
  user.append(bubble);
  document.body.append(user);
  input.textContent = '';
  const stop = document.createElement('button');
  stop.dataset.testid = 'stop-button';
  stop.textContent = 'Stop';
  document.body.append(stop);
  const response = document.createElement('div');
  response.setAttribute('data-message-author-role', 'assistant');
  const body = document.createElement('div');
  body.className = 'markdown';
  body.textContent = 'Wiadomość w trakcie pisania...';
  response.append(body);
  document.body.append(response);
  setTimeout(() => {
    body.textContent = 'Cześć Nino! Tu Jagoda. Nowy edytor został rozpoznany.';
    stop.remove();
  }, 4000);
});
</script></body></html>
